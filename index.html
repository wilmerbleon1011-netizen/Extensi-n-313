<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Extensión 313</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Pixelify+Sans:wght@400;500;600&family=Special+Elite&display=swap">
<style>
/* Concepto: un expediente clínico de 1987 proyectado en la oscuridad. Cada sala redefine su propia paleta (--r*). */
:root{
  --ink:#08090b; --ink2:#111416; --line:#252a2c; --bulb:#e7e0c8; --dim:#8f9a92; --faint:#4d5751;
  --paper:#d9d0b3; --paper-ink:#261f15; --blood:#c8442d; --ok:#86b98f; --warn:#e0b04a;
  --ac:#c8442d; --pagebg:#08090b;
  --rbg:#0a0c0e; --rink:#e7e0c8; --rac:#c8442d; --rac2:#3b2420; --rdim:#8f9a92;
  --f-disp:'Special Elite','Courier New',monospace;
  --f-body:'Newsreader',Georgia,'Times New Roman',serif;
  --f-pix:'Pixelify Sans','VT323',ui-monospace,Menlo,Consolas,monospace;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pagebg);color:var(--bulb);font:17px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;transition:background .8s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--pagebg)}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.15}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.kicker{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--f-mono)}
.dim{color:var(--dim)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 0;background:var(--pagebg);border-bottom:1px solid var(--line);transition:background .8s}
.brand{font:500 12px/1 var(--f-mono);letter-spacing:.22em;color:var(--dim);white-space:nowrap}
.brand b{color:var(--ac);font-weight:500}
.topr{display:flex;align-items:center;gap:12px;min-width:0}
.clock{font:500 20px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--bulb)}
.clock.low{color:var(--blood);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.mini{background:none;border:1px solid var(--line);color:var(--dim);font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border-radius:3px;cursor:pointer}
.mini:hover{color:var(--bulb);border-color:var(--faint)}
.mini[aria-pressed="true"]{color:var(--bulb);border-color:var(--ac)}
.wrap{max-width:920px;margin:0 auto;padding-block:22px 90px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ac);color:#fff;border:0;border-radius:3px;padding:12px 20px;font:500 13px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--faint);color:var(--bulb)}
.btn.ghost:hover{border-color:var(--ac)}
.btn.sm{padding:9px 12px;min-height:36px;font-size:11.5px}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.field{width:100%;background:var(--ink2);border:1px solid var(--faint);border-radius:3px;padding:12px 14px;font:500 16px/1.2 var(--f-mono);color:var(--bulb);min-height:46px}
.field:focus{border-color:var(--ac);outline:none}
select.field{appearance:auto}
label.lbl{display:block;font:500 11.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}

/* Entrada y sala de espera */
.hero{padding-block:8px 6px;display:flex;flex-direction:column;gap:16px}
.hero h1{font-size:clamp(34px,8vw,64px);line-height:1.02}
.hero h1 em{font-style:normal;color:var(--ac)}
.lede{font-size:19px;color:var(--bulb);max-width:60ch}
.lede.dimmer{color:var(--dim);font-size:16px}
.callbox{border:1px solid var(--line);background:var(--ink2);padding:16px;border-radius:4px;display:flex;flex-direction:column;gap:12px}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blood);margin-right:8px;animation:blink 1.4s steps(2) infinite}
.status-line{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;color:var(--dim)}
.status-line.err{color:var(--warn)}

/* Sala */
.room{display:flex;flex-direction:column;gap:18px}
.rhead{display:flex;flex-direction:column;gap:6px}
.rhead h2{font-size:clamp(28px,6vw,44px);color:var(--rink)}
.rhead .kicker{color:var(--rac)}
.wrap.wide{max-width:1240px}
.s1{fill:var(--rac2)}.s2{fill:var(--rac)}.s3{fill:var(--rbg)}.s4{fill:color-mix(in srgb,var(--rac) 30%,var(--rbg))}
.st{fill:none;stroke:var(--rac);stroke-width:2}.st2{fill:none;stroke:var(--rac2);stroke-width:2}
.glow{fill:var(--rac);opacity:.16}
.fx{position:absolute;inset:0;pointer-events:none}
.fx-frost{background:linear-gradient(115deg,transparent 30%,rgba(190,235,245,.09) 50%,transparent 70%);background-size:250% 100%;animation:sweep 9s linear infinite}
@keyframes sweep{from{background-position:150% 0}to{background-position:-50% 0}}
.fx-flicker{background:#000;animation:flk 4.3s steps(1) infinite}
@keyframes flk{0%{opacity:0}6%{opacity:.55}7%{opacity:0}9%{opacity:.7}10%{opacity:.1}40%{opacity:0}62%{opacity:.35}63%{opacity:0}100%{opacity:0}}
.fx-rain{background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(160,190,220,.16) 9px 10px);background-size:60px 60px;animation:rain .55s linear infinite}
@keyframes rain{to{background-position:-18px 60px}}
.fx-fog{background:radial-gradient(ellipse 60% 50% at 30% 70%,rgba(200,210,200,.13),transparent 70%),radial-gradient(ellipse 55% 45% at 75% 60%,rgba(200,210,200,.1),transparent 70%);background-size:140% 100%;animation:fog 14s ease-in-out infinite alternate}
@keyframes fog{to{background-position:100% 0;opacity:.5}}
.fx-static{background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);animation:stat .25s steps(3) infinite}
@keyframes stat{to{transform:translateY(3px)}}
.fx-pulse{box-shadow:inset 0 0 70px rgba(200,40,30,.0);animation:pls 2.4s ease-in-out infinite}
@keyframes pls{40%{box-shadow:inset 0 0 70px rgba(200,40,30,.35)}55%{box-shadow:inset 0 0 40px rgba(200,40,30,.1)}}
.fx-dust{background-image:radial-gradient(circle,rgba(255,240,200,.5) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(255,240,200,.35) 0 1px,transparent 1.5px);background-size:90px 70px,53px 61px;background-position:0 0,20px 30px;animation:dust 20s linear infinite;opacity:.5}
@keyframes dust{to{background-position:0 -280px,20px -244px}}
.fx-sway{background:radial-gradient(ellipse 25% 55% at 50% 0%,rgba(255,230,160,.22),transparent 75%);transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.intro{font-size:18px;max-width:62ch;color:var(--rink)}
.intro i{color:var(--rdim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{position:relative;background:color-mix(in srgb,var(--rac2) 55%,var(--rbg));border:1px solid color-mix(in srgb,var(--rac) 35%,transparent);border-radius:4px;padding:14px 10px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--rink);text-align:center;min-height:104px}
.tile:hover{border-color:var(--rac);transform:translateY(-1px)}
.tile svg{width:34px;height:34px;stroke:var(--rac);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile span{font:500 11.5px/1.25 var(--f-mono);letter-spacing:.04em}
.tile.seen::after{content:"visto";position:absolute;top:6px;right:8px;font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;color:var(--rdim);text-transform:uppercase}
.tile.seen{opacity:.82}
.lock{border:1px solid color-mix(in srgb,var(--rac) 55%,transparent);background:color-mix(in srgb,var(--rac2) 35%,var(--rbg));border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:14px}
.lock h3{font-size:22px;color:var(--rink)}
.lock .q{font-size:18px;color:var(--rink);max-width:62ch}
.lock .field{background:var(--rbg);border-color:color-mix(in srgb,var(--rac) 50%,transparent);color:var(--rink)}
.lock .btn{background:var(--rac)}
.lock .btn.ghost{background:none;color:var(--rink);border-color:color-mix(in srgb,var(--rac) 50%,transparent)}
.msg{font:500 13px/1.4 var(--f-mono);min-height:18px;color:var(--rdim)}
.msg.bad{color:var(--warn)}.msg.good{color:var(--ok)}
.seq{display:flex;gap:8px;flex-wrap:wrap}
.seq button{flex:1 1 74px;min-height:56px;border-radius:4px;border:1px solid color-mix(in srgb,var(--rac) 50%,transparent);background:var(--rbg);color:var(--rink);font:500 12px/1.2 var(--f-mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px}
.seq button .dot{width:14px;height:14px;border-radius:50%}
.seq button[aria-pressed="true"]{border-color:var(--rac);background:color-mix(in srgb,var(--rac) 22%,var(--rbg))}
.seqline{font:500 13px/1.4 var(--f-mono);color:var(--rdim);min-height:20px}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{border-left:2px solid var(--rac);padding:6px 0 6px 12px;color:var(--rink);font-size:16.5px}
.hint small{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rdim);margin-bottom:4px}
.seal{border:1px dashed var(--rac);background:color-mix(in srgb,var(--rac) 12%,var(--rbg));border-radius:4px;padding:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.seal .big{font:400 64px/1 var(--f-disp);color:var(--rac);min-width:64px;text-align:center}
.seal p{max-width:46ch;color:var(--rink)}
.seal .kicker{color:var(--rdim);display:block;margin-bottom:6px}
.teambar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.teambar .pip{width:26px;height:26px;border-radius:3px;border:1px solid var(--faint);display:grid;place-items:center;font:500 11px/1 var(--f-mono);color:var(--faint)}
.teambar .pip.on{background:var(--ok);border-color:var(--ok);color:#0b1a0e}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-6px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:12px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--bulb);border-color:var(--ac)}

/* Documentos mecanografiados */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.doc{position:relative;background:var(--paper);color:var(--paper-ink);width:min(560px,100%);max-height:100%;overflow:auto;padding:26px 24px 22px;border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:rotate(-.4deg)}
.doc h3{font-size:22px;margin-bottom:12px;border-bottom:1px solid rgba(38,31,21,.35);padding-bottom:8px}
.doc .typed{font:400 16.5px/1.6 var(--f-disp);white-space:pre-wrap}
.doc .typed p+p{margin-top:10px}
.doc .xbtn{position:absolute;top:8px;right:10px;background:none;border:0;font:500 12px/1 var(--f-mono);letter-spacing:.1em;color:var(--paper-ink);cursor:pointer;padding:8px;text-transform:uppercase}
.doc .extra{margin-top:14px;display:flex;justify-content:center}
.mclock{width:190px;height:190px}

/* Veredicto */
.final{display:flex;flex-direction:column;gap:18px}
.code{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.code input{width:100%;text-align:center;text-transform:uppercase;padding:10px 0;min-height:52px;font:500 22px/1 var(--f-mono);background:var(--ink2);border:1px solid var(--faint);border-radius:3px;color:var(--bulb)}
.code input:focus{border-color:var(--ac);outline:none}
.code small{display:block;text-align:center;font:500 10px/1 var(--f-mono);color:var(--faint);margin-top:4px}
.accuse{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* Expediente y tablero */
.ev{background:var(--paper);color:var(--paper-ink);padding:16px 18px;border-radius:2px;transform:rotate(var(--rot,0deg));box-shadow:0 6px 20px rgba(0,0,0,.45)}
.ev h4{font-size:16px;margin-bottom:6px}
.ev p{font:400 14.5px/1.5 var(--f-disp)}
.ev .src{display:block;margin-top:8px;font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.ev.new{animation:pin .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pin{from{transform:translateY(-30px) rotate(6deg) scale(1.06);opacity:0}}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.whisper-list{display:flex;flex-direction:column;gap:8px}
.wl{border-left:2px solid var(--blood);padding-left:12px;font-style:italic;color:var(--bulb)}
.empty{border:1px dashed var(--faint);border-radius:4px;padding:20px;color:var(--dim);text-align:center}
.sus{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sus button{background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--bulb);min-height:92px}
.sus button b{font:400 16px/1.2 var(--f-disp)}
.sus button span{font-size:13.5px;color:var(--dim);line-height:1.3}
.sus button.out{opacity:.35;text-decoration:line-through;border-style:dashed}
.sus button:disabled{cursor:default}
.host{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.host{grid-template-columns:minmax(0,1fr)}}
.bigclock{font:400 clamp(54px,11vw,104px)/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bigclock.low{color:var(--blood)}
.panel{border:1px solid var(--line);background:var(--ink2);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:19px}
table.pl{width:100%;border-collapse:collapse;font:400 13.5px/1.3 var(--f-mono)}
table.pl th{font-weight:500;text-align:left;color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 6px 6px 0}
table.pl td{padding:7px 6px 7px 0;border-top:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:2px;border:1px solid var(--faint);color:var(--dim)}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.bonus{border-color:var(--warn);color:var(--warn)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.rm-b{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px;text-align:left;cursor:pointer;color:var(--dim);font:500 11px/1.3 var(--f-mono);min-height:58px}
.rm-b b{display:block;color:var(--bulb);font-weight:500;margin-bottom:2px}
.rm-b.on{border-color:var(--ok);color:var(--ok)}
.rm-b.on b{color:var(--ok)}
.fxgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.end{text-align:center;padding-block:40px;display:flex;flex-direction:column;gap:18px;align-items:center}
.end h1{font-size:clamp(34px,8vw,64px)}
.end p{max-width:52ch;font-size:19px}
.end.win h1{color:var(--ok)}
.end.lose h1{color:var(--blood)}

/* Efectos globales (anfitrión) */
.fxb{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center;color:#6b6358;font:400 22px/1.3 var(--f-disp);text-align:center;padding:24px;animation:fin .6s}
@keyframes fin{from{opacity:0}}
.fxw{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:30px;text-align:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.2) 70%);animation:whs 5s forwards}
.fxw p{font:400 clamp(26px,6vw,54px)/1.15 var(--f-disp);color:#d8d0bc;text-shadow:0 0 24px rgba(200,68,45,.55);letter-spacing:.04em;max-width:18ch}
@keyframes whs{0%{opacity:0;filter:blur(8px)}15%{opacity:1;filter:blur(0)}75%{opacity:1}100%{opacity:0;filter:blur(6px)}}
.fxc{position:fixed;left:50%;top:max(80px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:88;background:#101214;border:1px solid #333a3d;border-radius:8px;padding:16px 22px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:ring .5s linear infinite;max-width:calc(100% - 32px)}
.fxc svg{width:30px;height:30px;stroke:var(--ok);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fxc b{font:500 14px/1.2 var(--f-mono);display:block}
.fxc small{font:400 12px/1.2 var(--f-mono);color:var(--dim)}
@keyframes ring{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-1.5deg)}75%{transform:translateX(-50%) rotate(1.5deg)}}
.shake{animation:shk .5s linear 3}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,4px)}}
.heart{position:fixed;inset:0;z-index:84;pointer-events:none;box-shadow:inset 0 0 140px rgba(190,30,20,.0);animation:hb 1.1s ease-out 6}
@keyframes hb{0%{box-shadow:inset 0 0 160px rgba(190,30,20,.55)}25%{box-shadow:inset 0 0 90px rgba(190,30,20,.15)}40%{box-shadow:inset 0 0 150px rgba(190,30,20,.45)}100%{box-shadow:inset 0 0 40px rgba(190,30,20,0)}}
.err{color:var(--warn)}
.enter{animation:enter 1.3s steps(1,end)}
@keyframes enter{0%{opacity:0}12%{opacity:1}20%{opacity:.15}30%{opacity:1}38%{opacity:.4}50%,100%{opacity:1}}
.fxb,.fxw,.heart{pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .enter{animation:none}
  .fx,.fx *,.fxc,.heart,.ev.new,.shake,.pulse,.clock.low,.bigclock.low{animation:none!important}
  .fxw{animation-duration:6s}
}

/* ===== Corte lateral de la habitación (estética de casa en sección, grano y oscuridad) ===== */
.stagewrap{display:flex;flex-direction:column;gap:8px}
.stagebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stage{position:relative;overflow-x:auto;overflow-y:hidden;border:2px solid #000;border-radius:3px;background:#020203;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--rac) 38%,transparent),0 20px 54px rgba(0,0,0,.65);scrollbar-width:thin;scrollbar-color:var(--rac2) #000;touch-action:pan-x pan-y}
.stagein{position:relative;min-width:780px;overflow:hidden}
.stage-svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.stage-svg text{font-family:var(--f-pix)}
.kbk{fill:#020203}.k0{fill:#050507}
.k1{fill:color-mix(in srgb,var(--rac2) 45%,#000)}
.k2{fill:color-mix(in srgb,var(--rac2) 88%,#000)}
.k3{fill:color-mix(in srgb,var(--rac2) 55%,var(--rac))}
.k4{fill:var(--rac)}
.k5{fill:color-mix(in srgb,var(--rac) 55%,#fff)}
.kw{fill:color-mix(in srgb,var(--rac2) 52%,var(--rbg))}
.kw2{fill:color-mix(in srgb,var(--rac2) 26%,var(--rbg))}
.kf{fill:color-mix(in srgb,var(--rac2) 62%,#000)}
.kf2{fill:color-mix(in srgb,var(--rac2) 34%,#000)}
.pl{fill:none;stroke:color-mix(in srgb,var(--rac2) 28%,var(--rbg));stroke-width:2}
.pk{fill:none;stroke:#000;stroke-width:2;opacity:.4}
.kp{fill:#d6cdb0}.kpd{fill:#9a917a}
.ky{fill:#ffd98a}.kr{fill:#b8402e}.kg{fill:#7fa08a}
.sky{fill:color-mix(in srgb,var(--rac2) 22%,#010208)}
.moon{fill:#e9edf6;opacity:.92}
.mir{fill:color-mix(in srgb,var(--rac2) 40%,#8a93a6);opacity:.88}
.glassc{fill:color-mix(in srgb,var(--rac) 30%,#cfe6ea);opacity:.22}
.scr{fill:none;stroke:color-mix(in srgb,var(--rac) 60%,#000);stroke-width:3;opacity:.7}
.sk{fill:none;stroke:#050507;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{fill:none;stroke:#b8402e;stroke-width:3;stroke-linecap:round}
.sg{fill:none;stroke:var(--rac);stroke-width:2.5;stroke-linejoin:round}
.sw{fill:none;stroke:#e9edf6;stroke-width:2;stroke-linecap:round}
.brass{fill:#b79a47}.brown{fill:#6b4a33}.steel{fill:#9aa6ab}
.shd{fill:#000;opacity:.42}
.ghc{fill:#dfe4e6}
.avd{fill:#07080b}.avr{fill:color-mix(in srgb,var(--rac) 55%,#000)}.avh{fill:#9aa3a8;stroke:none}.ave{fill:#f4f1e4}
.avt{fill:var(--rink);opacity:.85;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
.tx{text-anchor:middle;fill:var(--rink)}
.tl{text-anchor:start}
.tdim{fill:color-mix(in srgb,var(--rac) 40%,#fff);opacity:.95}
.tk{fill:#2a2418}
.tred{fill:#ff7058}
.av{transition-property:transform;transition-timing-function:linear;transition-duration:0s}
.av .avi{transform-origin:0 0}
.av.left .body,.av.left .legs{transform:scaleX(-1)}
.av.walk .avi{animation:bob .32s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.av.walk .legs rect:nth-child(1){animation:stepA .32s steps(2) infinite}
.av.walk .legs rect:nth-child(2){animation:stepB .32s steps(2) infinite}
@keyframes stepA{50%{transform:translateY(-4px)}}
@keyframes stepB{0%{transform:translateY(-4px)}50%{transform:none}}
.lamp{mix-blend-mode:screen;animation:lampg 5s ease-in-out infinite alternate}
.lamp.lf{animation:lampf 4.3s steps(1) infinite}
.lamp.lamp-on{opacity:1;filter:brightness(1.35)}
@keyframes lampg{from{opacity:.82}to{opacity:1}}
@keyframes lampf{0%,100%{opacity:1}6%{opacity:.2}7%{opacity:1}9%{opacity:.3}10%{opacity:.9}62%{opacity:.5}63%{opacity:1}}
.appar{opacity:0;animation:appar 47s linear infinite}
@keyframes appar{0%,90%{opacity:0}91.5%{opacity:.88}93%{opacity:0}94%{opacity:.7}96.5%,100%{opacity:0}}
.blink{animation:blinkeye 6s steps(1) infinite}
@keyframes blinkeye{0%,92%,100%{opacity:1}94%{opacity:0}}
.flame{animation:flame .18s steps(2) infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flame{to{transform:scale(.88,1.1)}}
.drip{animation:drip 2.2s linear infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{transform:translateY(46px);opacity:1}100%{transform:translateY(52px);opacity:0}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:transparent}
.hs .ol{fill:none;stroke:var(--rac);stroke-width:2.5;stroke-dasharray:8 5;opacity:0;transition:opacity .15s,fill .15s}
.hs:hover .ol,.hs:focus-visible .ol{opacity:1;fill:color-mix(in srgb,var(--rac) 17%,transparent)}
.hs .tg,.dl,.hs .pin{opacity:0;pointer-events:none;transition:opacity .15s}
.hs:hover .tg,.hs:focus-visible .tg{opacity:1}
.tg rect,.dl rect{fill:#050506;stroke:var(--rac);stroke-width:1.5}
.dl rect{stroke:var(--rdim);stroke-dasharray:3 2}
.tg text,.dl text{fill:var(--rink);font-size:15px;text-anchor:middle;font-family:var(--f-pix)}
.dl text{fill:var(--rdim);font-size:13px}
.hs .pin circle{fill:var(--rac)}
.hs .pin text{fill:#050506;font-size:14px;font-weight:600;text-anchor:middle}
.hs.seen .pin circle{fill:var(--ok)}
.rim{stroke:var(--rac);stroke-width:1;stroke-opacity:.75}
.pdot{fill:var(--rac);opacity:.9}
.pring{fill:none;stroke:var(--rac);stroke-width:1.5;animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(5);opacity:0}}
.hs.seen .ping{display:none}
.insp .hs .ol{opacity:.85}
.insp .hs .tg,.insp .dl,.insp .hs .pin{opacity:1}
.insp .hs .ping{display:none}
.stagein .fx{mix-blend-mode:screen;opacity:.8}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.34;animation:grain .5s steps(4) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 -.2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{background-position:0 0}25%{background-position:-40px 22px}50%{background-position:30px -50px}75%{background-position:-20px -10px}}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);opacity:.55}
.stagein .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%,transparent 45%,rgba(0,0,0,.7) 100%);pointer-events:none}
.legend{display:flex;flex-direction:column;gap:8px}
.lgrid{display:flex;flex-wrap:wrap;gap:8px}
.lg{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px 6px 8px;border:1px solid color-mix(in srgb,var(--rac) 38%,transparent);background:color-mix(in srgb,var(--rac2) 45%,var(--rbg));color:var(--rink);border-radius:3px;cursor:pointer;font:500 14px/1 var(--f-pix)}
.lg:hover{border-color:var(--rac)}
.lg b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--rac);color:#050506;font:600 12px/1 var(--f-pix)}
.lg svg{width:20px;height:20px;stroke:var(--rac);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lg i{font:normal 500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
.rhead h2,.hero h1,.end h1{font-family:var(--f-pix);font-weight:500;letter-spacing:.02em}
.clock,.bigclock{font-family:var(--f-pix)}
/* Hospital en corte (anfitrión y expediente) */
.hosp{width:100%;height:auto;display:block}
.hosp text{font-family:var(--f-pix)}
.hosp .cell{cursor:default}
.hosp .cell.clk{cursor:pointer}
.hosp .cell:hover .cb,.hosp .cell:focus-visible .cb{stroke:var(--warn);stroke-width:3}
.hosp .hl{fill:#ffd98a}
.hosp .mine .cb{stroke:var(--warn);stroke-width:3;stroke-dasharray:8 5}
.hosp .lit-glow{animation:lampg 3s ease-in-out infinite alternate}
.hosp .who{animation:bob .9s steps(2) infinite}
@media (prefers-reduced-motion:reduce){
  .grain,.lamp,.lamp.lf,.appar,.blink,.flame,.drip,.spin,.pring,.av.walk .avi,.av.walk .legs rect,.hosp .who,.hosp .lit-glow{animation:none!important}
  .appar{opacity:0}
}

/* ===== Pasada analógica: grano de cinta, trama CRT, aberración cromática, bordes tramados ===== */
:root{
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.9 -.45'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --dither:repeating-conic-gradient(var(--faint) 0 25%,transparent 0 50%) 0 0/4px 4px;
  --ca-r:rgba(255,50,40,.55); --ca-c:rgba(40,220,255,.4);
}
body::after{content:"";position:fixed;inset:0;z-index:70;pointer-events:none;mix-blend-mode:overlay;opacity:.3;
  background-image:var(--noise);background-size:220px 220px;animation:gr2 .6s steps(5) infinite}
@keyframes gr2{0%{background-position:0 0}20%{background-position:-70px 40px}40%{background-position:55px -90px}60%{background-position:-30px -20px}80%{background-position:90px 60px}}
html::after{content:"";position:fixed;inset:0;z-index:71;pointer-events:none;
  background:
   repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
   radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
html::before{content:"";position:fixed;left:0;right:0;top:-14vh;height:12vh;z-index:72;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.05) 45%,rgba(255,255,255,.09) 50%,transparent);
  mix-blend-mode:screen;animation:trk 11s linear infinite}
@keyframes trk{0%,70%{transform:translateY(0);opacity:0}72%{opacity:1}100%{transform:translateY(125vh);opacity:.8}}

/* Tipografía pixel en títulos y números: marca de una pantalla vieja */
h1,h2,.brand,.clock,.kicker{text-shadow:-1.5px 0 var(--ca-r),1.5px 0 var(--ca-c)}
h1{font-family:var(--f-pix);font-weight:500;letter-spacing:.02em}
h2{font-family:var(--f-pix);font-weight:500}
.clock{font-family:var(--f-pix);font-size:24px}
.brand{font-family:var(--f-pix);font-size:13px}
h3,h4{text-shadow:-1px 0 var(--ca-r),1px 0 var(--ca-c)}
p,.kicker,.mono,input,select{text-shadow:none}

/* Paneles: borde tramado en lugar de línea limpia, esquina cortada, mancha de tinta */
.panel{position:relative;border:0;border-radius:0;background:
   linear-gradient(135deg,rgba(255,255,255,.02),transparent 40%),var(--ink2);
  box-shadow:inset 0 0 0 1px var(--line),inset 0 0 40px rgba(0,0,0,.55);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--dither);opacity:.5;pointer-events:none}
.btn{border-radius:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.6);
  clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px));font-family:var(--f-pix);font-size:14px;letter-spacing:.08em}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.btn.ghost{box-shadow:inset 0 0 0 1px var(--faint)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ac)}
.btn:focus-visible,.hs:focus-visible,.cell:focus-visible,input:focus-visible,select:focus-visible{outline:2px dashed var(--warn);outline-offset:3px}
input,select{border-radius:0}

/* Escenario: grano más pesado, doble capa, aberración y parpadeo CRT */
.stagein .grain{opacity:.55;background-size:220px 220px;background-image:var(--noise)}
.stagein::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;
  background-image:var(--noise);background-size:97px 97px;animation:gr2 .9s steps(3) infinite reverse}
.stagein .scan{opacity:.7}
.stage-svg{filter:contrast(1.08) saturate(.9) drop-shadow(1.5px 0 0 rgba(255,40,30,.22)) drop-shadow(-1.5px 0 0 rgba(30,210,255,.18))}
.stagein{animation:crt 7s steps(1) infinite}
@keyframes crt{0%,93%,100%{filter:none}94%{filter:brightness(1.18) contrast(1.1)}95%{filter:brightness(.8)}96%{filter:none}}
.stagewrap{box-shadow:0 0 0 1px var(--line),0 0 60px rgba(0,0,0,.8)}
.hosp{filter:contrast(1.06) saturate(.92)}
.stage-svg.pic{filter:none}
.pic .avi{filter:contrast(1.1) saturate(.75) drop-shadow(1.2px 0 0 #000) drop-shadow(-1.2px 0 0 #000) drop-shadow(0 1.2px 0 #000)!important}
.stagein .grain{opacity:.4}
.pic .hit{pointer-events:all}

@media (prefers-reduced-motion:reduce){
  body::after,html::before,.stagein::after,.stagein{animation:none!important}
  html::before{display:none}
  .btn:not(:disabled):active{transform:none}
}
</style>

  }
  function handle(m){
    if (!m || !m.f) return;

      if (m.mid){ if (seenM.has(m.mid)) return; seenM.add(m.mid); if (seenM.size > 300) seenM = new Set(Array.from(seenM).slice(-150)); }
      const mine = m.f === me;
      (handlers[m.t] || []).forEach(h => { try { h({topic: m.t, data: m.d, peer: m.f, by: null, isMe: mine, sameTab: mine, kind: 'viewer', guest: false}); } catch (e) {} });
    } else if (m.k === 'p' && m.f !== me){

    try { es = new EventSource(BASE + '/' + TOPIC + '/sse?since=40s'); } catch (e) { sseOn = false; upd(); return; }

    es.onerror = () => { window.__sse = 'error'; sseOn = false; upd(); };

  }

    if (polling) return; polling = true;
    try { const r = await fetch(BASE + '/' + TOPIC + '/json?poll=1&since=30s'); const t = await r.text(); t.split('\n').forEach(l => { if (l.trim()) onMsg(l); }); } catch (e) {}

  }
  function sendPres(force){
    const go = () => { lastSend = Date.now(); post({k: 'p', f: me, p: myPres}).catch(() => {}); };
    if (force){ clearTimeout(sendT); sendT = null; go(); return; }

function clockSVG(h, m){
  const ha = (h % 12) * 30 + m * 0.5, ma = m * 6; let t = '';

  return `<svg class="mclock" viewBox="0 0 200 200" role="img" aria-label="Reloj de pared visto en el espejo"><circle cx="100" cy="100" r="96" fill="#efe7cc" stroke="#261f15" stroke-width="4"/>${t}<line x1="100" y1="100" x2="100" y2="48" stroke="#261f15" stroke-width="7" stroke-linecap="round" transform="rotate(${ha} 100 100)"/><line x1="100" y1="100" x2="100" y2="26" stroke="#7a2418" stroke-width="4" stroke-linecap="round" transform="rotate(${ma} 100 100)"/><circle cx="100" cy="100" r="6" fill="#261f15"/></svg>`;
}

function doorP(x, w = 84, h = 212, o = {}){
  const y = 322 - h;
  return rc(x - 6, y - 6, w + 12, h + 6, 'k0') + rc(x, y, w, h, 'k2') + rc(x + 8, y + 10, w - 16, Math.round(h * .36), 'k1') + rc(x + 8, y + Math.round(h * .5), w - 16, Math.round(h * .42), 'k1')

function winP(x, y, w, h, view = 'night', arch = false){
  let o = rc(x - 7, y - 7, w + 14, h + 14, 'k1') + rc(x, y, w, h, 'sky');
  if (view === 'moon' || view === 'rain') o += ci(x + w * .72, y + h * .28, Math.min(w, h) * .13, 'moon');
  if (view === 'rain'){ for (let i = 0; i < 16; i++) o += rc(x + 6 + (i * 29) % (w - 12), y + 6 + (i * 47) % (h - 18), 1.5, 14, 'k5', ' opacity=".45"'); }

  if (view === 'bars'){ for (let i = 1; i < 5; i++) o += rc(x + i * w / 5 - 1.5, y, 3, h, 'k0'); }
  o += rc(x + w / 2 - 2, y, 4, h, 'k1') + rc(x, y + h / 2 - 2, w, 4, 'k1') + rc(x - 11, y + h + 7, w + 22, 7, 'k2');

    o += rc(px, y - bh, bw, bh, c) + rc(px, y - bh, bw, 2, 'k5', ' opacity=".3"'); px += bw + 1; }

  let o = rc(x - 4, y - 4, w + 8, h + 4, 'k0') + rc(x, y, w, h, 'k1');

  for (let i = 0; i < rows; i++){ const yy = y + (i + 1) * rh; o += bookRow(x + 4, yy - 5, w - 8, seed + i * 5, rh * .5, rh * .82) + rc(x, yy - 5, w, 5, 'k2') + rc(x, yy, w, 2, 'k0'); }

const freshG = () => ({epoch: rid(), status: 'lobby', startedAt: 0, endedAt: 0, durationMs: 45 * 60000, adjMs: 0,

function remaining(){
  if (G.status === 'lobby') return G.durationMs;
  const end = (G.status === 'won' || G.status === 'lost') ? (G.endedAt || nowS()) : nowS();
  return G.startedAt + G.durationMs + G.adjMs - end;

const pubState = () => ({epoch: G.epoch, status: G.status, startedAt: G.startedAt, endedAt: G.endedAt, durationMs: G.durationMs,
  adjMs: G.adjMs, assign: G.assign, solved: G.solved, cross: G.cross, hs: Object.values(G.hintsBy).reduce((a, b) => a + b, 0), t: Date.now()});

let annT = null;
function lobbyBeat(){
  if (!net.db || net.host || mode === 'host' || !P.pid) return;
  try { net.db.doc('lobby/' + P.pid).set({pid: P.pid, name: String(P.name || '').slice(0, 24), joined: !!P.joined, epoch: P.epoch || '', room: P.room || null,
    solved: !!P.solved, hints: hintsTotal(), wrong: P.wrong | 0, fin: P.fin || null, ts: Date.now()}).then(() => { net.dg.lw = 'ok'; }).catch(e => { net.dg.lw = (e && e.code) || 'err'; }); } catch (e) { net.dg.lw = 'exc'; }
}

      solved: !!P.solved, hints: hintsTotal(), wrong: P.wrong | 0, fin: P.fin || null, host: mode === 'host'}).then(() => { net.dg.pw = 'ok'; }).catch(e => { net.dg.pw = (e && e.code) || 'err'; });
  }, 120);
}

function resetProgress(epoch){

/* Recibe el estado que emite el anfitrión */
function applyState(s){
  if (!s || typeof s !== 'object') return;
  if (s.t) net.skew = s.t - Date.now();
  const before = JSON.stringify([G.status, P.room, P.epoch]);
  if (s.epoch && P.epoch !== s.epoch) resetProgress(s.epoch);
  ['epoch', 'status', 'startedAt', 'endedAt', 'durationMs', 'adjMs', 'hs'].forEach(k => { if (s[k] != null) G[k] = s[k]; });
  G.assign = s.assign || {}; G.solved = s.solved || {}; G.cross = s.cross || [];
  const mine = G.assign[P.pid];
  if (mine && P.room !== mine){ P.room = mine; P.solved = false; P.fin = null; tab = 'room'; saveP(); }
  announce();
  const after = JSON.stringify([G.status, P.room, P.epoch]);
  if (before !== after) route(); else refreshLive();
}
function hostSelf(){

}

/* ===== Lógica del anfitrión ===== */
let bcT = null, saveT = null, savingNow = false;
function broadcast(force){
  if (!net.host) return;
  if (bcT && !force) return;
  if (net.room) net.room.emit('state', pubState()).catch(() => {});
  bcT = setTimeout(() => { bcT = null; }, 350);
}
function persist(){
  store.set('x313g', G);
  if (!net.db) return;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    if (savingNow) return persist();
    savingNow = true;
    try { await net.db.doc('game/state').set(JSON.parse(JSON.stringify(G))); } catch (e) {}
    savingNow = false;
  }, 900);
}
function hostCommit(){ broadcast(true); persist(); hostSelf(); refreshLive(); }

function hostPlayers(){
  const map = new Map();
  for (const p of net.peers){
    const x = p.presence;
    if (!x || !x.pid || x.host || p.kind !== 'viewer') continue;
    const old = map.get(x.pid);
    if (!old || p.updatedAt >= old.updatedAt) map.set(x.pid, Object.assign({}, x, {updatedAt: p.updatedAt, isMe: p.isMe}));
  }
  const now = Date.now();
  for (const x of Object.values(net.lobby || {})){
    if (!x || !x.pid || !x.ts || now - x.ts > 30000) continue;
    const old = map.get(x.pid);
    if (!old || x.ts > old.updatedAt) map.set(x.pid, Object.assign({}, x, {updatedAt: x.ts, isMe: false}));
  }
  return Array.from(map.values());
}
function pickRoom(){
  if (!G.order.length) G.order = shuffle(CORE_IDS).concat(shuffle(BONUS_IDS));
  const used = {}; Object.values(G.assign).forEach(r => { used[r] = (used[r] || 0) + 1; });
  return G.order.map((id, i) => ({id, i, u: used[id] || 0})).sort((a, b) => a.u - b.u || a.i - b.i)[0].id;
}
function computeAdj(){
  const bonus = Object.keys(G.solved).filter(id => ROOM_BY[id] && !ROOM_BY[id].pos).length * BONUS_MS;
  const hints = Object.values(G.hintsBy).reduce((a, b) => a + b, 0) * HINT_MS;
  const wrong = Object.values(G.wrongBy).reduce((a, b) => a + b, 0) * WRONG_MS;
  return bonus - hints - wrong;
}
function hostSync(){
  if (!net.host) return;
  let ch = false;
  const pl = hostPlayers();
  for (const p of pl){
    const same = !p.epoch || p.epoch === G.epoch;
    if (!same) continue;
    if (G.status === 'playing' && p.joined && !G.assign[p.pid]){ G.assign[p.pid] = pickRoom(); ch = true; }
    if (p.epoch !== G.epoch) continue;
    if (p.room && p.solved && !G.solved[p.room] && ROOM_BY[p.room]){ G.solved[p.room] = String(p.name || 'Alguien'); ch = true; }
    if ((p.hints | 0) > (G.hintsBy[p.pid] | 0)){ G.hintsBy[p.pid] = p.hints | 0; ch = true; }
    if ((p.wrong | 0) > (G.wrongBy[p.pid] | 0)){ G.wrongBy[p.pid] = p.wrong | 0; ch = true; }
    if (p.fin && p.fin.ok && G.status === 'playing'){ G.status = 'won'; G.endedAt = Date.now(); ch = true; setTimeout(() => sendFx({t: 'call', id: rid()}), 2600); }
  }
  const adj = computeAdj();
  if (adj !== G.adjMs){ G.adjMs = adj; ch = true; }
  if (ch) hostCommit(); else refreshLive();
}
function hostStart(){
  G.order = shuffle(CORE_IDS).concat(shuffle(BONUS_IDS));
  G.assign = {}; G.status = 'playing'; G.startedAt = Date.now(); G.endedAt = 0;
  hostPlayers().forEach(p => { if (p.joined) G.assign[p.pid] = pickRoom(); });
  hostSync(); hostCommit();
}
function hostReset(){

}
function hostEnd(res){ if (G.status === 'playing'){ G.status = res; G.endedAt = Date.now(); hostCommit(); if (res === 'won') setTimeout(() => sendFx({t: 'call', id: rid()}), 2600); } }
function hostToggleSolved(id){

function currentView(){
  if (mode === 'host') return pv ? 'preview' : 'host';
  if (!P.joined) return 'join';
  if (G.status === 'won' || G.status === 'lost') return 'end';
  if (net.offline) return P.room ? 'play' : 'pick';
  if (G.status === 'lobby' || !P.room) return 'wait';
  return 'play';
}
let lastView = '';
function route(){
  const v = currentView(), app = $('#app');
  if (v === 'join' && lastView === 'join'){ refreshLive(); return; }
  if (v === 'play') setPalette(ROOM_BY[P.room]); else if (v === 'preview' && pv.id) setPalette(ROOM_BY[pv.id]); else clearPalette();
  const views = {preview: viewPreview, join: viewJoin, wait: viewWait, pick: viewPick, end: viewEnd, play: viewPlay, host: viewHost};
  app.innerHTML = views[v]();
  if (v === 'play') renderPane();
  if (v === 'preview' && pv.id){ centerStage(); crispText(); window.scrollTo({top: 0}); }
  if (v === 'play' && lastView !== 'play'){ app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); }
  app.classList.toggle('wide', v === 'host');
  lastView = v;
  const mb = $('#modebtn'); if (mb){ mb.hidden = !net.host; mb.textContent = mode === 'host' ? 'Ver como jugador' : 'Volver al tablero'; }
  sfx.room(P.room && v === 'play' ? P.room : null);

}

}

/* ===== Sonido (apagado por defecto) ===== */
const sfx = (() => {
  let ctx = null, on = !!store.get('x313s', false), dr = null, cur = null;
  const C = () => { if (!on) return null; if (!ctx){ try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; };
  const tone = (f, d = .2, type = 'sine', g = .12, when = 0, to) => {

    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    a.gain.setValueAtTime(.0001, t); a.gain.exponentialRampToValueAtTime(g, t + .015); a.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(a); a.connect(c.destination); o.start(t); o.stop(t + d + .05);
  };

    const c = C(); if (!c) return; const n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf; const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q;
    const a = c.createGain(), t = c.currentTime + when; a.gain.setValueAtTime(g, t); a.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(fl); fl.connect(a); a.connect(c.destination); s.start(t);
  };
  const stopDrone = () => { if (dr){ try { dr.g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .8); dr.o.forEach(o => o.stop(ctx.currentTime + .9)); } catch (e) {} dr = null; } };
  const startDrone = id => {
    stopDrone(); const c = C(); if (!c || !id) return;
    let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 997;
    const base = 46 + (h % 22), g = c.createGain(), lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    g.gain.value = .0001; g.gain.exponentialRampToValueAtTime(.045, c.currentTime + 2);
    const o = [base, base * 1.5 + .7, base * 2.01].map((f, i) => { const x = c.createOscillator(); x.type = i ? 'sine' : 'sawtooth'; x.frequency.value = f; x.connect(lp); x.start(); return x; });
    lp.connect(g); g.connect(c.destination); dr = {o, g};
  };
  const btn = () => { const b = $('#snd'); if (b){ b.textContent = 'Sonido: ' + (on ? 'sí' : 'no'); b.setAttribute('aria-pressed', String(on)); } };
  return {
    btn, get on(){ return on; },
    toggle(){ on = !on; store.set('x313s', on); btn(); if (on){ C(); tone(180, .3, 'sine', .08, 0, 90); startDrone(cur); } else stopDrone(); },
    room(id){ cur = id; if (on) startDrone(id); },
    ok(){ tone(392, .25, 'triangle', .1); tone(523, .3, 'triangle', .1, .12); tone(659, .5, 'triangle', .1, .26); },
    bad(){ tone(110, .35, 'sawtooth', .08, 0, 70); },
    tick(){ tone(520, .06, 'square', .04); },
    paper(){ noise(.18, .05, 3000, 0, .6); },
    knock(){ [0, .35, .7].forEach(w => { tone(95, .16, 'sine', .35, w, 50); noise(.08, .12, 400, w, 1); }); },
    thump(){ tone(70, .6, 'sine', .3, 0, 38); noise(.5, .08, 200); },
    ring(){ for (let i = 0; i < 4; i++){ tone(880, .18, 'sine', .08, i * .55); tone(660, .18, 'sine', .08, i * .55 + .2); } },
    beat(){ for (let i = 0; i < 6; i++){ tone(62, .14, 'sine', .4, i * 1.1, 40); tone(58, .14, 'sine', .3, i * 1.1 + .22, 38); } },
    whisper(){ noise(1.4, .09, 2400, 0, 3); noise(1.1, .06, 1500, .5, 4); }
  };
})();

/* ===== Arranque ===== */
let tk = 0;
function tick(){
  tk++;
  if (net.host){
    if (G.status === 'playing' && remaining() <= 0){ G.status = 'lost'; G.endedAt = Date.now(); hostCommit(); }
    else { hostSync(); hostSelf(); if (tk % 4 === 0) broadcast(true); }
  } else if (net.offline && G.status === 'playing' && remaining() <= 0){ G.status = 'lost'; G.endedAt = Date.now(); route(); }
  refreshLive();
}
const WEB = !!window.__X313;
const mkCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ', N = '23456789'; let c = ''; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; for (let i = 0; i < 2; i++) c += N[Math.floor(Math.random() * N.length)]; return c; };
function gateView(){
  $('#app').innerHTML = `<div class="stack" style="max-width:520px;margin:6vh auto 0"><div><span class="kicker">Extensión 313</span><h2 style="font-size:clamp(28px,6vw,44px);margin-top:8px">¿Cómo entras?</h2><p class="dim" style="margin-top:10px">Quien dirige la partida la crea y recibe un código. Los demás lo escriben para unirse.</p></div>
    <div class="panel" style="padding:20px"><h3 style="margin-bottom:10px">Unirme a una partida</h3><form data-form="gjoin" class="stack"><label class="kicker" for="gcode">Código de sala</label><input id="gcode" class="field" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="Ej. ABCD23" style="text-transform:uppercase;letter-spacing:.2em;font-size:22px"><button class="btn" type="submit">Unirme a partida</button><span class="status-line" id="gmsg"></span></form></div>
    <div class="panel" style="padding:20px"><h3 style="margin-bottom:10px">Soy el anfitrión</h3><p class="dim" style="margin-bottom:12px">Crea la sala, comparte el código y controla la partida.</p><button class="btn ghost" data-g="create">Crear partida</button></div></div>`;
}
function setRoomChoice(code, role){ try { localStorage.setItem('x313room', JSON.stringify({code, role})); localStorage.setItem('x313go', '1'); } catch (e) {} try { localStorage.removeItem('x313p'); localStorage.removeItem('x313g'); } catch (e) {} location.hash = ''; location.reload(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-g]'); if (!b) return;
  const g = b.dataset.g;
  if (g === 'create') setRoomChoice(mkCode(), 'host');
  else if (g === 'copy'){ const c = (window.__X313 || {}).code || ''; (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(() => { b.textContent = 'Copiado'; }).catch(() => { b.textContent = c; }); }
  else if (g === 'leave'){ if (confirm('¿Salir de esta partida?')){ try { localStorage.removeItem('x313room'); } catch (e) {} location.reload(); } }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form="gjoin"]'); if (!f) return; e.preventDefault();
  const c = ($('#gcode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length < 4){ $('#gmsg').textContent = 'Escribe el código completo.'; return; }
  setRoomChoice(c, 'player');
});
function diagText(){ const d = net.dg; return `v15 p2p:${window.__p2p || '-'} sse:${window.__sse || '-'} room:${net.room ? (net.online ? 'on' : 'off') : 'NULL'} db:${net.db ? 'ok' : 'NULL'} user:${net.user ? 'ok' : 'NULL'} host:${net.host ? 1 : 0} peers:${net.peers.length} pres:${d.pw || '-'} lobby:${d.lw || '-'} send:${window.__lastPost || '-'} fxerr:${d.fe || '-'} err:${[d.st, d.fx, d.pe, d.cn, d.ds, d.df].filter(Boolean).join(',') || '-'}`;
}
async function boot(){
  if (WEB && !window.__X313.has){ gateView(); return; }
  sfx.btn(); route();
  if (WEB){ const t = document.createElement('div'); t.style.cssText = 'position:fixed;right:8px;bottom:6px;z-index:900;font:11px var(--f-mono);color:var(--dim);opacity:.8'; t.innerHTML = `Sala ${esc(window.__X313.code)} · <a href="#" data-g="leave" style="color:inherit" onclick="event.preventDefault()">Salir</a>`; document.body.appendChild(t); }
  setInterval(tick, 1000);
  const [room, db, user] = await Promise.all([use('room'), use('db'), use('user')]);
  net.room = room; net.db = db; net.user = user;
  const dge = k => e => { net.dg[k] = (e && e.code) || 'err'; };
  setInterval(() => {
    let el = document.getElementById('dg'); if (!el){ el = document.createElement('div'); el.id = 'dg'; if (!net.host && !/dg/.test(location.hash)) return; el.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;font:12px monospace;color:#0f0;background:#000d;padding:2px 4px;pointer-events:none;max-width:95vw'; document.body.appendChild(el); }
    const d = net.dg; el.textContent = diagText();
  }, 1000);
  if (!room) net.offline = true;
  try { net.host = !!(user && await user.isOwner()); } catch (e) { net.host = false; }
  if (net.host){
    mode = 'host';
    if (/salas/.test(location.hash)) pv = {id: null, solved: false};
    let loaded = null;
    if (db){ try { const s = await db.doc('game/state').get(); if (s.exists) loaded = s.data(); } catch (e) {} }
    if (!loaded) loaded = store.get('x313g', null);
    if (loaded) G = Object.assign(freshG(), loaded);
    if (P.epoch !== G.epoch) resetProgress(G.epoch);
    store.set('x313g', G);
  } else if (db){
    try { const s = await db.doc('game/state').get(); if (s.exists) applyState(s.data()); } catch (e) {}
  }
  if (room){
    room.on('state', m => { if (!net.host) applyState(m.data); }, dge('st'));
    room.on('fx', m => { if (!m.sameTab) recvFx(m.data); }, dge('fx'));
    room.onPeers(ch => { net.peers = ch.peers; if (net.host){ hostSync(); if (ch.joined.length) broadcast(true); } else refreshLive(); }, dge('pe'));
    room.onConnection(c => { net.online = c; if (c){ net.offline = false; announce(); if (net.host) broadcast(true); } refreshLive(); },
      e => { dge('cn')(e); if (e && (e.code === 'not_granted' || e.code === 'revoked')){ net.offline = true; route(); } });
    announce();
  }
  if (db){
    const t0 = Date.now();
    try {
      if (!net.host){
        db.doc('game/state').onSnapshot(s => { if (s.exists) applyState(s.data()); }, dge('ds'));
        db.doc('game/fx').onSnapshot(s => { if (s.exists){ const d = s.data(); if (d && d.ts && d.ts >= t0 - 15000) recvFx(d); } }, dge('df'));
      } else {
        db.collection('lobby').onSnapshot(sn => { const o = {}; sn.docs.forEach(d => { o[d.id] = d.data(); }); net.lobby = o; hostSync(); refreshLive(); }, () => {});
        setInterval(() => { if (Object.keys(net.lobby).length){ hostSync(); refreshLive(); } }, 5000);
      }
    } catch (e) {}
  }
  if (!net.host) setInterval(lobbyBeat, 10000);
  setTimeout(() => { if (!net.online && !net.offline){ net.offline = true; route(); } }, 7000);
  net.ready = true; route();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) act(b.dataset.a, b); });
document.addEventListener('submit', e => {
  const f = e.target.closest('form'); if (!f) return; e.preventDefault();
  const k = f.dataset.form; if (k === 'join') doJoin(); else if (k === 'lock') tryAnswer(); else if (k === 'final') submitFinal();
});
document.addEventListener('change', e => { if (e.target.id === 'hdur') hostSetDuration(+e.target.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDoc();
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.hs, .hospbox .cell')){ e.preventDefault(); act(t.dataset.a, t); return; }
  if (t.matches && t.matches('.code input') && e.key === 'Backspace' && !t.value){ const p = $('#c' + (+t.dataset.i - 1)); if (p) p.focus(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches && t.matches('.code input')){
    const v = t.value.replace(/[^A-Za-zÑñ]/g, '');
    if (v.length > 1){ v.toUpperCase().split('').slice(0, 8 - +t.dataset.i).forEach((ch, k) => { const c = $('#c' + (+t.dataset.i + k)); if (c) c.value = ch; }); return; }
    t.value = v.toUpperCase();
    if (t.value){ const n = $('#c' + (+t.dataset.i + 1)); if (n) n.focus(); }
  }
});
boot();
